services:

  # -----------------------------------
  # FRONTEND
  # -----------------------------------

  frontend:
    build:
      context: ./Frontend

    container_name: frontend

    restart: always

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://13.48.203.193:8080

    depends_on:
      - backend

    networks:
      - arbitrage-network

  # -----------------------------------
  # BACKEND
  # -----------------------------------

  backend:
    build:
      context: ./Backend

    container_name: backend

    restart: always

    ports:
      - "8080:8080"

    environment:

      # DATABASE
      POSTGRES_DSN: host=postgres user=postgres password=Rihaan@123 dbname=crypto_arb port=5432 sslmode=disable

      # REDIS
      REDIS_ADDR: redis:6379

      # KAFKA
      KAFKA_BROKER: kafka:9092

      # PAYMENT SERVICE
      PAYMENT_GRPC_ADDR: payment-service:50051

      # JWT
      JWT_SECRET: super-secret-key

      # EXCHANGE KEYS
      BYBIT_KEY: k2YtJYCfjpl3hfPaPx
      BYBIT_SECRET: zfkpToi93tDnWlkHKtO1jifbSErhXot0cExH

      BINANCE_KEY: l741V8EPssJjSMlsz2fOnwKeavDpBhcD3SQhJ4io5hNAnvwPw6zmSKgNhJIy44gg
      BINANCE_SECRET: zngkjvz83tEsXdb0kzCoqAcWFNec6pRdrvnzJbgV7iW44aV6iaSxearFNpLTeEBD

      #Google Auth
      GOOGLE_CLIENT_ID: 560044356850-lvlm99cng9i1lusi76dt882eb2b5cvjm.apps.googleusercontent.com

    
      FRONTEND_ORIGIN: http://13.48.203.193:5173

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      kafka:
        condition: service_started

      payment-service:
        condition: service_started

    networks:
      - arbitrage-network

  # -----------------------------------
  # PAYMENT SERVICE
  # -----------------------------------

  payment-service:
    build:
      context: ./Backend
      dockerfile: ./cmd/payment/Dockerfile

    container_name: payment-service

    restart: always

    ports:
      - "50051:50051"

    networks:
      - arbitrage-network

  # -----------------------------------
  # POSTGRES
  # -----------------------------------

  postgres:
    image: postgres:16

    container_name: postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rihaan@123
      POSTGRES_DB: crypto_arb

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - arbitrage-network

  # -----------------------------------
  # REDIS
  # -----------------------------------

  redis:
    image: redis/redis-stack:latest

    container_name: redis

    restart: always

    ports:
      - "6379:6379"

    networks:
      - arbitrage-network

  # -----------------------------------
  # ZOOKEEPER
  # -----------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0

    container_name: zookeeper

    restart: always

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - arbitrage-network

  # -----------------------------------
  # KAFKA
  # -----------------------------------

  kafka:
    image: confluentinc/cp-kafka:7.4.0

    container_name: kafka

    restart: always

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - arbitrage-network

  # -----------------------------------
  # PROMETHEUS
  # -----------------------------------

  prometheus:
    image: prom/prometheus

    container_name: prometheus

    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - arbitrage-network

  # -----------------------------------
  # GRAFANA
  # -----------------------------------

  grafana:
    image: grafana/grafana

    container_name: grafana

    restart: always

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana

    networks:
      - arbitrage-network

# -----------------------------------
# NETWORKS
# -----------------------------------

networks:
  arbitrage-network:

# -----------------------------------
# VOLUMES
# -----------------------------------

volumes:
  postgres-data:
  grafana-storage: